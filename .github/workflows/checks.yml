name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK and data checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem app/src/main/assets -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { throw "Syntax check failed: $($_.Name)" }
          }
      - name: Parser, backup, protocol and catalog tests
        shell: pwsh
        run: ./tools/test-parser.ps1 -JdkPath $env:JAVA_HOME
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK with temporary CI key
        shell: pwsh
        run: ./build-apk.ps1 -SdkPath $env:ANDROID_HOME -JdkPath $env:JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: ilenbook-ci-apk
          path: dist/ilenbook-*.apk
          retention-days: 14
